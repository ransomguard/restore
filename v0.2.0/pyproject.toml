[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ransomguard-integration"
version = "0.6.1"
description = "RansomGuard recovery and JEV: hourly VSS snapshots, event intake and explicit response simulation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.5", "python-dotenv>=1,<2"]

[project.scripts]
ransomguard = "ransomguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ransomguard*", "core*"]

[tool.setuptools]
py-modules = ["create_snapshot", "vss_recovery"]

